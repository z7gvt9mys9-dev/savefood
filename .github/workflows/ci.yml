# CI: builds and verifies the three deployable components, gated by changed paths.
#
# - backend-tests: `./mvnw test` in backend-java — runs the full JUnit suite
#   (pure logic only: ESG math, billing gating, gamification levels, forecast,
#   auth/JWT, KYC crypto, availability windows, routing, geo verification,
#   receipt anti-fraud). No database and no Spring context needed.
# - frontend-build: unit tests + production React build of savefood/.
# - android-build: compiles the native client. It ships 58 wired endpoints, so a
#   contract change that breaks it must not reach main unnoticed.
# - backend-integration: the transactional chains against a real Postgres
#   (Testcontainers). Separate from backend-tests so the fast unit job stays
#   database-free.
# - geows-build: compile + vet of the Go websocket microservice.
#
# The `changes` job computes path filters; build jobs are skipped (not omitted)
# when their paths are untouched, so required status checks still pass on PRs
# that don't affect them. Every filter includes this workflow file, so editing
# it re-runs all jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled, but every push to main runs to
  # completion so no main commit lands unverified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      android: ${{ steps.filter.outputs.android }}
      geows: ${{ steps.filter.outputs.geows }}
    steps:
      # On pull_request the action reads changed files from the GitHub API;
      # a checkout is only needed to diff push events.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-java/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'savefood/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android-app/**'
              - '.github/workflows/ci.yml'
            geows:
              - 'go-services/geows/**'
              - '.github/workflows/ci.yml'

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # setup-java's `cache: maven` covers only ~/.m2/repository; the wrapper
      # downloads the Maven distribution into ~/.m2/wrapper.
      - name: Cache Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend-java/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test

  backend-integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Cache Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend-java/.mvn/wrapper/maven-wrapper.properties') }}
      # Covers what the unit job cannot: guarded updates, partial unique indexes,
      # UPDATE … RETURNING and rollback — plus it applies V1__baseline.sql through
      # Flyway, which is the only check that a fresh deploy actually comes up.
      - name: Integration tests
        # GitHub-hosted runners currently expose Docker API v1.48 at most.
        # The project default is tuned for newer local Docker Desktop releases,
        # so override it here rather than making local integration tests fail.
        run: ./mvnw -B --no-transfer-progress -Dapi.version=1.48 -Pintegration verify

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: savefood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: savefood/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  android-build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      # Compile only: no emulator, no instrumentation. This catches the failure
      # that actually happens here — an API/DTO change the client no longer
      # matches — without paying for a device matrix.
      - name: Compile
        run: ./gradlew :app:assembleDevDebug -x lint --no-daemon

  geows-build:
    needs: changes
    if: needs.changes.outputs.geows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go-services/geows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-services/geows/go.mod
          cache-dependency-path: go-services/geows/go.sum
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
