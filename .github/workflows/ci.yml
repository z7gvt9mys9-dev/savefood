# CI: backend unit tests + frontend production build + Go microservice build.
# No database is needed — the pytest suite covers pure logic (routing 2-opt,
# ESG math, receipt anti-fraud, billing gating, levels, forecast, auth).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest
        env:
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
          CORS_ORIGIN: http://localhost:3000
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savefood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: savefood/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  geows-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-services/geows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-services/geows/go.mod
          cache-dependency-path: go-services/geows/go.sum
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
