# CI: Java backend unit tests + frontend production build + Go microservice build.
# No database needed — the Maven test suite covers pure logic (ESG math, billing
# gating, gamification levels, forecast, auth/JWT, KYC crypto, availability windows).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run Maven tests
        run: mvn test -B --no-transfer-progress

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savefood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: savefood/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  geows-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-services/geows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-services/geows/go.mod
          cache-dependency-path: go-services/geows/go.sum
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
