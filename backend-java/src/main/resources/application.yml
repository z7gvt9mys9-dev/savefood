server:
  port: ${SERVER_PORT:8000}
  tomcat:
    # Do not drain an unbounded rejected request body before closing the connection.
    max-swallow-size: 1MB

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:production}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.05}
  send-default-pii: false

spring:
  application:
    name: savefood-backend
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:savefood}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: pre-flyway schema (alembic 0001-0014 + init_db DDL)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
    property-naming-strategy: SNAKE_CASE

savefood:
  jwt-secret: ${SECRET_KEY:}
  local-tz: ${LOCAL_TZ:Europe/Moscow}
  volunteer-upload-dir: ${VOLUNTEER_UPLOAD_DIR:../backend/volunteer/uploads}
  delivery-photo-upload-dir: ${DELIVERY_PHOTO_UPLOAD_DIR:../backend/volunteer/delivery_photos}
  volunteer-kyc-upload-dir: ${VOLUNTEER_KYC_UPLOAD_DIR:../backend/volunteer/kyc_uploads}
  volunteer-kyc-required: ${VOLUNTEER_KYC_REQUIRED:true}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:support@savefood.local}
    fcm-enabled: ${FCM_ENABLED:false}
    fcm-project-id: ${FCM_PROJECT_ID:}
    fcm-credentials-json: ${FCM_CREDENTIALS_JSON:}
    fcm-credentials-file: ${FCM_CREDENTIALS_FILE:}
  # All lot-matching delivery is best-effort; DROP_OLDEST is the alternative rejection policy.
  matching:
    executor:
      workers: ${MATCHING_WORKERS:2}
      queue-capacity: ${MATCHING_QUEUE_CAPACITY:64}
      rejection: ${MATCHING_REJECTION:DROP_NEWEST}
    telegram:
      workers: ${MATCHING_TELEGRAM_WORKERS:4}
      queue-capacity: ${MATCHING_TELEGRAM_QUEUE_CAPACITY:128}
      rejection: ${MATCHING_TELEGRAM_REJECTION:DROP_NEWEST}
    push:
      workers: ${PUSH_DISPATCH_WORKERS:4}
      queue-capacity: ${PUSH_DISPATCH_QUEUE_CAPACITY:128}
      rejection: ${PUSH_DISPATCH_REJECTION:DROP_NEWEST}
    recipient-candidates: ${MATCHING_RECIPIENT_CANDIDATES:200}
    volunteer-candidates: ${MATCHING_VOLUNTEER_CANDIDATES:200}
    candidate-query-timeout-seconds: ${MATCHING_CANDIDATE_QUERY_TIMEOUT_SECONDS:5}
    recipients-notified: ${MATCHING_RECIPIENTS_NOTIFIED:20}
    volunteers-notified: ${MATCHING_VOLUNTEERS_NOTIFIED:10}
    telegram-sends: ${MATCHING_TELEGRAM_SENDS:30}
    push-sends: ${MATCHING_PUSH_SENDS:100}
    subscriptions-per-channel: ${PUSH_SUBSCRIPTIONS_PER_CHANNEL:5}
    partner-creates-per-minute: ${PARTNER_LOT_CREATES_PER_MINUTE:30}
  background-tasks: ${BACKGROUND_TASKS_JAVA:off}
  reservation-ttl-batch-size: ${RESERVATION_TTL_BATCH_SIZE:100}
  kyc-retry-batch: ${KYC_RETRY_BATCH:100}
  kyc-doc-retention-hours: ${KYC_DOC_RETENTION_HOURS:0}
  webhook:
    worker-count: ${WEBHOOK_WORKER_COUNT:8}
    queue-capacity: ${WEBHOOK_QUEUE_CAPACITY:100}
    request-timeout: ${WEBHOOK_REQUEST_TIMEOUT:10s}
    max-retries: ${WEBHOOK_MAX_RETRIES:2}
    initial-backoff: ${WEBHOOK_INITIAL_BACKOFF:100ms}
    max-per-shop: ${WEBHOOK_MAX_PER_SHOP:20}
    max-in-flight-per-shop: ${WEBHOOK_MAX_IN_FLIGHT_PER_SHOP:2}
  support-chat-id: ${SUPPORT_CHAT_ID:}
  telegram:
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  metrics-token: ${METRICS_TOKEN:}
  ai-model: ${AI_MODEL:${OCR_MODEL:gemini-2.5-flash}}
  proxy:
    vless-url: ${VLESS_URL:}
    xray-binary: ${XRAY_BINARY:./vendor/xray}
  shop-upload-dir: ${SHOP_UPLOAD_DIR:../backend/shop/uploads}
  lot-photo-staging:
    ttl: ${LOT_PHOTO_STAGING_TTL:45m}
    max-pending-count: ${LOT_PHOTO_STAGING_MAX_PENDING_COUNT:10}
    max-pending-bytes: ${LOT_PHOTO_STAGING_MAX_PENDING_BYTES:26214400}
    cleanup-batch-size: ${LOT_PHOTO_STAGING_CLEANUP_BATCH_SIZE:100}
    upload-rate-per-minute: ${LOT_PHOTO_STAGING_UPLOAD_RATE_PER_MINUTE:20}
  receipt-upload-dir: ${RECEIPT_UPLOAD_DIR:../backend/shop/receipt_uploads}
  gemini-api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
  ocr-model: ${OCR_MODEL:${AI_MODEL:gemini-2.5-flash}}
  receipt-max-age-hours: ${RECEIPT_MAX_AGE_HOURS:48}
  needy-upload-dir: ${NEEDY_UPLOAD_DIR:../backend/needy/uploads}
  kyc-encryption-key: ${KYC_ENCRYPTION_KEY:}
  kyc-plaintext-enabled: false
  kyc-model: ${KYC_MODEL:${AI_MODEL:gemini-2.5-flash}}
  kyc:
    ok-threshold: ${KYC_OK_THRESHOLD:0.7}
    fraud-threshold: ${KYC_FRAUD_THRESHOLD:0.3}
  photo-model: ${PHOTO_MODEL:${AI_MODEL:gemini-2.5-flash}}
  photo-auto-moderate: ${PHOTO_AUTO_MODERATE:false}
  photo-auto-approve-score: ${PHOTO_AUTO_APPROVE_SCORE:0.85}
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    yandex-client-id: ${YANDEX_CLIENT_ID:}
    yandex-client-secret: ${YANDEX_CLIENT_SECRET:}
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-bot-name: ${TELEGRAM_BOT_NAME:savefood_bot}
    public-url: ${OAUTH_PUBLIC_URL:${SITE_URL:http://localhost:3000}}

---
spring:
  config:
    activate:
      on-profile: "dev | test"
savefood:
  kyc-plaintext-enabled: ${KYC_ALLOW_PLAINTEXT:false}
