# docker-java (bundled with Testcontainers) negotiates API v1.32 by default.
# Docker Desktop 4.x refuses anything below v1.40 with a bare HTTP 400, which
# surfaces as the deeply unhelpful "Could not find a valid Docker environment"
# even though the socket is reachable and healthy.
#
# Docker Desktop 29 rejects the previous 1.44 pin.  docker-java/Testcontainers
# 1.20.x cannot initialise reliably against the server's newest 1.54 endpoint,
# while 1.51 is supported by Docker Desktop 29 and lets it negotiate the real
# server version afterwards. Callers on a newer daemon can override it with
# -Dapi.version=... when needed.
api.version=1.51
