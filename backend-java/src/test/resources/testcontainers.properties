# docker-java (bundled with Testcontainers) negotiates API v1.32 by default.
# Docker Desktop 4.x refuses anything below v1.40 with a bare HTTP 400, which
# surfaces as the deeply unhelpful "Could not find a valid Docker environment"
# even though the socket is reachable and healthy.
#
# 1.44 is old enough to be supported by every daemon we care about and new enough
# to clear that floor.
api.version=1.44
