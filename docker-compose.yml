version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savefood}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Backend is reached only through nginx on the internal docker network.
    # Exposing 8000 on the host would let attackers bypass nginx rate-limits.
    expose:
      - "8000"
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-savefood}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-savefood_bot}
      # true = long-polling (default), false = webhook via /telegram/webhook
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-true}
      SITE_URL: ${SITE_URL:-http://localhost}
      VLESS_URL: ${VLESS_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set (no wildcards in production)}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Telegram chat id of the support team for route-timeout alerts (§22.3)
      SUPPORT_CHAT_ID: ${SUPPORT_CHAT_ID:-}
      # AI support assistant in the bot (Google Gemini); empty = escalate to admin
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      # Social login (OAuth). Empty pair = the provider's button is hidden.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      # Public base URL for OAuth redirect_uri (defaults to SITE_URL)
      OAUTH_PUBLIC_URL: ${OAUTH_PUBLIC_URL:-}
      # Timezone used to interpret recipients' available_time windows
      LOCAL_TZ: ${LOCAL_TZ:-Asia/Almaty}
      # Maintenance loops run in the dedicated `worker` service, not in the API
      BACKGROUND_TASKS: external
      # Redis cache (hot reads: lots list, stats, volunteer locations)
      REDIS_URL: redis://redis:6379/0
      # Observability (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Web Push / VAPID (optional — empty keys hide the subscribe toggle)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # KYC is fully automated (§58.1): the AI verdict decides, no opt-in flag.
      # Gate that blocks unverified volunteers from routes (default ON).
      VOLUNTEER_KYC_REQUIRED: ${VOLUNTEER_KYC_REQUIRED:-true}
      # Fernet key for KYC document encryption-at-rest. Empty = stored
      # UNENCRYPTED (dev only). Generate: Fernet.generate_key().
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:-}
    healthcheck:
      # /readyz also checks DB reachability, so the container only reports
      # healthy once it can actually serve requests (curl is in the image).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - shop_uploads:/app/backend/shop/uploads
      - needy_uploads:/app/backend/needy/uploads
      # without this volume delivery photos are lost on every container rebuild
      - volunteer_uploads:/app/backend/volunteer/uploads

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Выделенный воркер фоновых задач (expiry лотов, таймауты маршрутов,
  # GPS-антифрод §27) — backend/background.py. API-контейнер с
  # BACKGROUND_TASKS=external циклы не запускает, поэтому его можно
  # масштабировать на несколько реплик без дублирования задач.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-savefood}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      SUPPORT_CHAT_ID: ${SUPPORT_CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VLESS_URL: ${VLESS_URL:-}
      LOCAL_TZ: ${LOCAL_TZ:-Asia/Almaty}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      # Worker runs the KYC verification/retry tick → must decrypt documents.
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:-}
      KYC_DOC_RETENTION_HOURS: ${KYC_DOC_RETENTION_HOURS:-0}

  # Go-микросервис горячих путей (§31): WebSocket-фанаут уведомлений и
  # приём/чтение геокоординат волонтёров. Делит БД и SECRET_KEY с backend.
  geows:
    build:
      context: ./go-services/geows
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-savefood}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}

  frontend:
    build:
      context: ./savefood
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
        VITE_YANDEX_SUGGEST_API_KEY: ${VITE_YANDEX_SUGGEST_API_KEY:-}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      geows:
        condition: service_started

volumes:
  postgres_data:
  shop_uploads:
  needy_uploads:
  volunteer_uploads:
