version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savefood}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Backend is reached only through nginx on the internal docker network.
    # Exposing 8000 on the host would let attackers bypass nginx rate-limits.
    expose:
      - "8000"
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-savefood}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-savefood_bot}
      SITE_URL: ${SITE_URL:-http://localhost}
      VLESS_URL: ${VLESS_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set (no wildcards in production)}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - shop_uploads:/app/backend/shop/uploads
      - needy_uploads:/app/backend/needy/uploads

  frontend:
    build:
      context: ./savefood
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
        VITE_YANDEX_SUGGEST_API_KEY: ${VITE_YANDEX_SUGGEST_API_KEY:-}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  shop_uploads:
  needy_uploads:
