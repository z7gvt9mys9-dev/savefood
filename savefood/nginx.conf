# The compose port is bound to loopback, so only the local cloudflared process
# can reach this server.  Within that trusted tunnel hop, use Cloudflare's
# client address for per-user rate limits.  Do not accept arbitrary header text
# as a rate-limit key: a direct/spoofed value falls back to the peer address.
map $http_cf_connecting_ip $client_real_ip {
    ~^[0-9A-Fa-f:.]+$ $http_cf_connecting_ip;
    default            $remote_addr;
}

# Rate-limit zone for credential endpoints. Lives at http {} level via conf.d include.
limit_req_zone $client_real_ip zone=auth:10m rate=5r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Дефолт nginx (1m) отбрасывал любое фото с телефона: лоты и KYC-документы
    # не загружались. 60m покрывает 5 фото лота по 15MB-лимиту бэкенда.
    client_max_body_size 60m;

    # Security headers (applied to every response, including error pages).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hot paths served by the Go microservice (geows, §31): WebSocket
    # notification fan-out and volunteer location ingest/read.
    location ~ ^/ws/ {
        proxy_pass http://geows:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Must be declared before the generic /volunteers catch-all below.
    location ~ ^/volunteers/[0-9]+/location$ {
        proxy_pass http://geows:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /stats {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
    }

    # Throttled credential endpoints — declared before the generic /auth catch-all
    # so the rate-limit hits first.
    location = /auth/login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # `/auth` is the React sign-in page. Keep the exact SPA route out of the
    # generic `/auth/*` API proxy below; otherwise a direct visit returns the
    # backend's 404 page instead of the application.
    location = /auth {
        try_files /index.html =404;
    }

    # These are client-side dashboard routes. Their API namespaces share the
    # same prefixes, so exact locations must win when a user reloads a page.
    location = /needy {
        try_files /index.html =404;
    }

    location = /admin {
        try_files /index.html =404;
    }

    location ~ ^/(shops|volunteers|needy)/register$ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /impact (no slash) is the public SPA dashboard page; only /impact/* API
    # calls (summary, cities, volunteers, feed) go to the backend.
    location ~ ^/impact/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public lot photos served straight off the shared volume. Delivery proofs
    # deliberately do NOT have an nginx alias: the Java impact endpoint checks
    # both fulfilment and moderation before it reads a private file.
    # `^~` so these win over the SPA fallback and the API regex below.
    location ^~ /uploads/ {
        alias /srv/uploads/;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
    # Liveness/readiness — public on purpose (external uptime monitoring).
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        access_log off;
    }

    # Prometheus scrape — NOT public. Business gauges (open tickets, pending
    # moderation) are operational data. Reachable only from private networks:
    # a scraper inside the compose network talks to backend:8000 directly, this
    # location exists for a scraper on the host/VPN. METRICS_TOKEN is the second
    # layer if it is set.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        access_log off;
    }

    # API surface, all served by the Java backend.
    # `tickets` — the in-app chat (§53); without it chat requests fall into the
    # SPA fallback and come back as index.html.
    # `telegram` — the bot webhook (§16). Telegram itself POSTs here, so it must
    # be reachable from the outside; the endpoint verifies the shared secret.
    location ~ ^/(auth|shops|lots|volunteers|needy|admin|stats|push|api|tickets|telegram)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
    }

    # Service worker — never cache so phones always get the latest version
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # React SPA — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
