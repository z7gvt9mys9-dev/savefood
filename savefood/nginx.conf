# Behind a Cloudflare Tunnel every connection arrives from localhost, so
# $remote_addr is useless as a rate-limit key (one shared bucket for the whole
# world — a single attacker could exhaust everyone's login attempts). Prefer
# the client IP Cloudflare passes in CF-Connecting-IP and fall back to
# $remote_addr for direct access.
map $http_cf_connecting_ip $client_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Rate-limit zone for credential endpoints. Lives at http {} level via conf.d include.
limit_req_zone $client_real_ip zone=auth:10m rate=5r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (applied to every response, including error pages).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hot paths served by the Go microservice (geows, §31): WebSocket
    # notification fan-out and volunteer location ingest/read.
    location ~ ^/ws/ {
        proxy_pass http://geows:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Must be declared before the generic /volunteers catch-all below.
    location ~ ^/volunteers/[0-9]+/location$ {
        proxy_pass http://geows:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /stats {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
    }

    # Throttled credential endpoints — declared before the generic /auth catch-all
    # so the rate-limit hits first.
    location = /auth/login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(shops|volunteers|needy)/register$ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # NB: volunteer_uploads must be listed explicitly — "volunteers" does not
    # match it, and without it delivery photos fall into the SPA fallback and
    # come back as index.html.
    # /impact (no slash) is the public SPA dashboard page; only /impact/* API
    # calls (summary, cities, volunteers, feed) go to the backend.
    location ~ ^/impact/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public upload files served straight off the shared volumes (the Java
    # backend only writes them; there is no StaticFiles mount to proxy to now).
    # `^~` so these win over the SPA fallback and the API regex below.
    location ^~ /uploads/ {
        alias /srv/uploads/;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
    location ^~ /volunteer_uploads/ {
        alias /srv/volunteer_uploads/;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # API surface, all served by the Java backend. NB: `telegram` is gone — the
    # aiogram bot/webhook is not ported; only /auth/telegram/* account-linking
    # remains (covered by the `auth` group above/here).
    location ~ ^/(auth|shops|lots|volunteers|needy|admin|stats|push|api)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
    }

    # Service worker — never cache so phones always get the latest version
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # React SPA — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
